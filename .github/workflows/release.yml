# Publish vegacode to TestPyPI, then PyPI, when a GitHub release is published (tag vX.Y.Z).
# Trusted publishing (OIDC): no API tokens anywhere. The pending publishers on pypi.org and
# test.pypi.org name exactly this file (release.yml) and the environments `testpypi` and `pypi`.
# The `pypi` environment has a required reviewer, so the last job waits for approval.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build sdist and wheel
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Built files carry the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l dist
          test -f "dist/vegacode-$VERSION.tar.gz"
          test -f "dist/vegacode-$VERSION-py3-none-any.whl"
          test "$(ls dist | wc -l)" -eq 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke-test the wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        # Windows is not supported (never run or tested), so a release does not depend on it.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install into a clean venv and run outside any checkout
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          "$bin/python" -m pip install "dist/vegacode-$VERSION-py3-none-any.whl"
          mkdir -p "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          export VEGA_HOME="$RUNNER_TEMP/vega-home"
          "$bin/vega" --help
          "$bin/vegacode" --help
          "$bin/vega" models
          "$bin/vega" features
          "$bin/vega" config
          "$bin/python" -c "import importlib.metadata as m; assert m.version('vegacode') == '$VERSION'"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vegacode/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write # trusted publishing and attestations
      attestations: write # GitHub artifact attestations (build provenance)
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Build provenance attestation (GitHub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish (PEP 740 attestations are generated by the action)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # a re-run after a failed PyPI step must not fail here on files already uploaded
          skip-existing: true
          attestations: true
          print-hash: true

  publish-pypi:
    name: Publish to PyPI (needs approval)
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/vegacode/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish (PEP 740 attestations are generated by the action)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true
