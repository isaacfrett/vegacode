# Vega's model catalogue: local models that run free on a laptop. Shipped with Vega; read by
# `vega model list|pull|recommend|watch` and the Models pane. Edit it like models.toml: one
# [models.NAME] table per model, NAME being the profile name the model gets when it is pulled or
# queued.
#
# Minimum requirements: a 16 GB Apple silicon Mac. A model qualifies when it runs there within the
# memory budget: its loaded size at its quantization (Ollama /api/ps) is at most 10 GB
# (model_store.MEMORY_BUDGET_GB; VEGA_MODEL_MEMORY_BUDGET_GB changes it), measured with Vega's
# harness and HQ running (`vega lab bench model-screen PROFILE`). Until measured, the estimate is
# ram_gb below. Models over the budget are listed as out of scope, never as comparison targets.
# Parameter count does not decide: a mixture-of-experts (MoE) model needs memory for its TOTAL
# parameters (every expert is loaded) and runs at the speed of its ACTIVE parameters.
#
# Fields
#   label        display name (first-run setup and lists)
#   tag          the Ollama model to pull (`ollama pull <tag>`; hf.co/... pulls a Hugging Face GGUF)
#   family       library family, for `vega model watch --online`
#   params_b     total parameters, billions
#   active_params_b  MoE: parameters used per token, billions (speed follows these)
#   architecture dense (default), moe, hybrid (recurrent/conv + attention) or hybrid-moe
#   quant        quantization of the download (Q4_K_M, MXFP4, ...)
#   download_gb  approximate download / disk size in GB (10^9 bytes). Measured on this machine
#                where `size_source = "measured"`, otherwise the Ollama library listing.
#                `vega model pull` asks the registry for the exact size before downloading.
#   ram_gb       RAM the fit rule says it needs: download_gb x 1.25 + 2 GB (weights, an 8K
#                context cache and runtime). Fits: <= 60% of total RAM; tight: <= 85%. Also the
#                memory-budget estimate until loaded_gb is measured.
#   loaded_gb    measured loaded size (/api/ps) on the minimum-requirements machine; decides the
#                memory budget when present
#   tool_calling Ollama tool calling: yes / no / unverified (the screen's probe measures it)
#   status       shown with the entry, e.g. "not screened" or "out of scope: over the budget"
#   verified     which fields were checked, where and when; every other field is unverified
#   licence      the weights' licence (all free to run locally; read the terms for commercial use)
#   default      the model Vega ships with (one entry); fallback: the next choice
#   num_ctx / request / features_on / features_off / temperature   profile settings when Vega adds it
#   renderer / parser  Ollama's built-in prompt renderer and reply parser for the profile's Modelfile
#                (RENDERER / PARSER): a Hugging Face GGUF whose hf.co template has no tool format gets
#                the same wiring as the family's library build. Library models keep their own (FROM).
#
# Eval scores are not kept here: model_store merges them from a separate scores file when one
# exists (model_store.SCORES_FILE). Without it the catalogue lists models with no scores.

