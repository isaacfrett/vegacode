# Vega's model catalogue: local models under 10B parameters that run free on a laptop. Shipped
# with Vega; read by `vega model list|pull|recommend|watch` and the
# Models pane. Edit it like models.toml: one [models.NAME] table per model, NAME being the profile
# name the model gets when it is pulled or queued.
#
# Fields
#   tag          the Ollama model to pull (`ollama pull <tag>`)
#   family       library family, for `vega model watch --online`
#   params_b     parameters, billions (Vega uses models under 10B only)
#   download_gb  approximate download / disk size in GB (10^9 bytes). Measured on this machine
#                where `size_source = "measured"`, otherwise the Ollama library listing.
#                `vega model pull` asks the registry for the exact size before downloading.
#   ram_gb       RAM the fit rule says it needs: download_gb x 1.25 + 2 GB (weights, an 8K
#                context cache and runtime). Fits: <= 60% of total RAM; tight: <= 85%.
#   licence      the weights' licence (all free to run locally; read the terms for commercial use)
#   default      the model Vega ships with (one entry); fallback: the next choice
#   num_ctx / request / features_on / temperature   profile settings when Vega adds it
#
# Eval scores are not kept here: model_store merges them from a separate scores file when one
# exists (model_store.SCORES_FILE). Without it the catalogue lists models with no scores.

updated = "2026-10-16"

[models.granite-8b]
tag = "granite4.1:8b"
family = "granite"
params_b = 8.8
download_gb = 5.3
size_source = "measured"
ram_gb = 8.6
licence = "Apache-2.0"
default = true
num_ctx = 8192
notes = "Shipped default since 2026-10-15."

